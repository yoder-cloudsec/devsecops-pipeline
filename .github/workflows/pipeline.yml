name: pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: eu-south-2
  ECR_REPOSITORY: devsecops-pipeline
  # "false" = report mode: scanners run and show findings but do not block.
  # "true"  = enforce mode: any finding fails the pipeline and blocks the push.
  ENFORCE: "true"
  TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        continue-on-error: ${{ env.ENFORCE != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Static analysis
        continue-on-error: ${{ env.ENFORCE != 'true' }}
        run: >
          semgrep scan --metrics=off --error
          --config p/python --config p/security-audit --config p/owasp-top-ten app/

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit dependencies
        continue-on-error: ${{ env.ENFORCE != 'true' }}
        run: |
          pip install --quiet pip-audit
          pip-audit -r app/requirements.txt

  build:
    needs: [gitleaks, semgrep, dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t devsecops-pipeline:${{ github.sha }} app/

      - name: Scan Dockerfile (Trivy config)
        continue-on-error: ${{ env.ENFORCE != 'true' }}
        run: |
          docker run --rm -v "$PWD/app:/src" aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 /src

      - name: Scan image (Trivy)
        continue-on-error: ${{ env.ENFORCE != 'true' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            devsecops-pipeline:${{ github.sha }}

      - name: Assume AWS role via OIDC (no stored keys)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Tag and push
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag devsecops-pipeline:$GITHUB_SHA "$IMAGE"
          docker push "$IMAGE"
          
      - name: Resolve the pushed image digest
        if: github.event_name == 'push'
        id: digest
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image: $REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the SBOM (Trivy, CycloneDX)
        if: github.event_name == 'push'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:latest image --format cyclonedx --output /out/sbom.cdx.json \
            devsecops-pipeline:${{ github.sha }}

      - name: Keep the SBOM as a build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image and attach the SBOM attestation (keyless)
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.ref }}
        run: |
          cosign version
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"

      - name: Verify signature and attestation, pinned to this workflow's identity
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ steps.digest.outputs.ref }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@refs/heads/main
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" > /dev/null
          echo "Signed and verified: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"