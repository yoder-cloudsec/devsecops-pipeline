name: rescan-latest-image

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to rescan (defaults to the latest commit on main)"
        required: false

permissions:
  contents: read

env:
  AWS_REGION: eu-south-2
  ECR_REPOSITORY: devsecops-pipeline
  TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  rescan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Pick the image to rescan
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --query 'sort_by(imageDetails[?imageTags!=`null` && !starts_with(imageTags[0], `sha256-`)], &imagePushedAt)[-1].imageTags[0]' \
              --output text)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rescan with today's vulnerability data
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ inputs.tag || github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker pull "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"